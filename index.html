<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercultural Effectiveness Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
</head>
<body>
  <div class="dashboard-layout container">
    <nav class="sidebar">
      <h1>Intercultural Dashboard</h1>
      <p class="subtitle">Intrivity + Erin Meyer Sliders</p>
    </nav>

    <main class="content-area">
      <section id="sec0" class="panel active">
        <h2>Upload Intrivity PDF + Enter Erin Meyer Sliders</h2>

        <div class="card">
          <h3>📄 Intrivity Upload</h3>
          <div class="action-row">
            <label class="btn-secondary" for="pdf-input">Upload Intrivity PDF</label>
            <input id="pdf-input" type="file" accept=".pdf" hidden>
          </div>
          <div id="pdf-status" class="status-box"></div>
          <div id="mrts-display" class="tool-box" style="display:none;">
            <strong>MRTS Profile:</strong> <span id="mrts-code"></span>
            <div class="grid-4 mt-2">
              <div>Message: <span id="m-score">-</span>/5</div>
              <div>Relationship: <span id="r-score">-</span>/5</div>
              <div>Time: <span id="t-score">-</span>/5</div>
              <div>Space: <span id="s-score">-</span>/5</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>🌍 Erin Meyer Manual Inputs (0-10)</h3>
          <div class="grid-2">
            <div><label>Communicating <span id="val-communicating">5/10</span></label><input id="communicating" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('communicating', this.value)"></div>
            <div><label>Evaluating <span id="val-evaluating">5/10</span></label><input id="evaluating" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('evaluating', this.value)"></div>
            <div><label>Leading <span id="val-leading">5/10</span></label><input id="leading" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('leading', this.value)"></div>
            <div><label>Deciding <span id="val-deciding">5/10</span></label><input id="deciding" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('deciding', this.value)"></div>
            <div><label>Trusting <span id="val-trusting">5/10</span></label><input id="trusting" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('trusting', this.value)"></div>
            <div><label>Disagreeing <span id="val-disagreeing">5/10</span></label><input id="disagreeing" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('disagreeing', this.value)"></div>
            <div><label>Scheduling <span id="val-scheduling">5/10</span></label><input id="scheduling" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('scheduling', this.value)"></div>
            <div><label>Persuading <span id="val-persuading">5/10</span></label><input id="persuading" type="range" min="0" max="10" step="0.5" value="5" oninput="updateVal('persuading', this.value)"></div>
          </div>
        </div>

        <div class="card">
          <h3>Interactive Domain Insights</h3>
          <div class="action-row" id="domain-buttons"></div>
          <button id="generate-insights-btn" class="btn-primary">Generate All Domain Insights</button>
          <div id="insights-box" class="mt-2"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
